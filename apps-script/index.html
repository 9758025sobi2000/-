<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<title>일정 참석 회신</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 행정 공문 대장 느낌 — 상단 기관 헤더, 탭 3개(응답/일정관리/집계), 단일 컬럼 카드 목록 */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sunken: #e9edf3; --ink: #17212c; --muted: #5d6b7c; --line: #d6dde6;
  --accent: #1d4f86; --accent-soft: #e2ebf6; --on-accent: #ffffff;
  --yes: #1f7a4d; --yes-soft: #def2e7; --no: #b23a3a; --no-soft: #f8e1e1; --warn: #8a5a00; --warn-soft: #fbefd5;
  --t-meet: #1d4f86; --t-event: #7a3f8f; --t-trip: #2c6e6a;
  --f-display: "Noto Serif KR", "Nanum Myeongjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161d; --surface: #19212b; --sunken: #222c38; --ink: #e6ebf1; --muted: #9aa8b8; --line: #2f3b49;
    --accent: #7fb0e6; --accent-soft: #1f3247; --on-accent: #0d1620;
    --yes: #6fd19e; --yes-soft: #173528; --no: #f08c8c; --no-soft: #3d1f22; --warn: #e8bd6a; --warn-soft: #3a2e15;
    --t-meet: #7fb0e6; --t-event: #cf9ae0; --t-trip: #7fcfc8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
[hidden] { display: none !important; }
.wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 20px; }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--f-display); font-size: 28px; margin: 2px 0 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 17px; margin: 0; text-wrap: balance; }
.who { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.role { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { appearance: none; border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
label.f .req { color: var(--no); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
.span2 { grid-column: 1 / -1; }
.profile-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.btn { appearance: none; font: inherit; font-weight: 600; font-size: 14px; border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--no); border-color: var(--no); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; font: inherit; font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.list { display: grid; gap: 12px; }
.ev { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--tc, var(--accent)); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.ev[data-type="회의"] { --tc: var(--t-meet); }
.ev[data-type="행사"] { --tc: var(--t-event); }
.ev[data-type="출장"] { --tc: var(--t-trip); }
.ev-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; justify-content: space-between; }
.type { font-size: 12px; font-weight: 700; color: var(--tc); border: 1px solid var(--tc); border-radius: 4px; padding: 0 6px; margin-right: 8px; }
.ev h3 { margin: 0; font-size: 17px; display: inline; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; margin: 0; }
.meta dt { color: var(--muted); font-size: 13px; }
.meta dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; white-space: pre-line; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.yes { background: var(--yes-soft); color: var(--yes); }
.pill.no { background: var(--no-soft); color: var(--no); }
.pill.wait { background: var(--sunken); color: var(--muted); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { appearance: none; font: inherit; font-weight: 600; border: 0; background: var(--surface); color: var(--muted); padding: 8px 18px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-v="참석"] { background: var(--yes); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="불참"] { background: var(--no); color: var(--surface); }
.seg button:disabled { cursor: not-allowed; opacity: .6; }
.saved { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }
.notice { padding: 10px 14px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 6px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.sum { display: grid; gap: 10px; }
.sum-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 260px) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.sum-row[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sum-row .t { min-width: 0; }
.sum-row .t small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 10px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar i { display: block; }
.bar .y { background: var(--yes); }
.bar .n { background: var(--no); }
.nums { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nums .y { color: var(--yes); } .nums .n { color: var(--no); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--sunken); font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: 700; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.stat b { font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat.y b { color: var(--yes); } .stat.n b { color: var(--no); }
.bycat { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.bycat b { color: var(--ink); font-variant-numeric: tabular-nums; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--no); }
@media (max-width: 560px) {
  .sum-row { grid-template-columns: minmax(0, 1fr) auto; }
  .sum-row .bar { grid-column: 1 / -1; order: 3; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">전부서 회의·행사·출장 등 참석 여부 확인</div>
      <h1>일정 참석 회신</h1>
    </div>
    <div class="who">
      <span id="who-role" class="role">응답자</span>
      <button type="button" class="btn small" id="admin-open">관리자 로그인</button>
      <button type="button" class="btn small" id="admin-logout" hidden>관리자 로그아웃</button>
    </div>
  </header>

  <form class="panel" id="admin-form" hidden>
    <div class="panel-head"><h2>관리자 로그인</h2><button type="button" class="btn small" id="admin-close">닫기</button></div>
    <p class="hint">행정실에서 설정한 관리자 비밀번호를 입력하면 일정 관리와 결과 집계 화면이 열립니다.</p>
    <div class="row">
      <input id="admin-pw" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" style="max-width:280px">
      <button class="btn primary" type="submit" id="admin-login">로그인</button>
    </div>
  </form>

  <div class="notice" id="error-box" hidden></div>

  <nav class="tabs" role="tablist" aria-label="화면 전환">
    <button role="tab" id="tab-respond" aria-selected="true" data-tab="respond">참석 응답</button>
    <button role="tab" id="tab-manage" aria-selected="false" data-tab="manage" hidden>일정 관리</button>
    <button role="tab" id="tab-results" aria-selected="false" data-tab="results" hidden>결과 집계</button>
  </nav>

  <!-- 참석 응답 -->
  <section id="view-respond" class="list" style="gap:20px">
    <form class="panel" id="profile-form" autocomplete="on">
      <div class="panel-head">
        <h2>응답자 인적사항</h2>
        <span class="saved" id="profile-saved"></span>
      </div>
      <p class="hint">한 번 저장하면 모든 응답에 함께 기록됩니다. 성명, 소속 부서(학과), 구분은 필수입니다.</p>
      <div class="grid profile-grid">
        <label class="f"><span>성명 <span class="req" aria-hidden="true">*</span></span><input id="p-name" name="name" required maxlength="30" placeholder="홍길동"></label>
        <label class="f"><span>소속 부서(학과) <span class="req" aria-hidden="true">*</span></span><input id="p-dept" name="dept" required maxlength="40" placeholder="예: 학생처, 기계공학과"></label>
        <label class="f"><span>구분 <span class="req" aria-hidden="true">*</span></span>
          <select id="p-category" name="category" required>
            <option value="">선택</option>
            <option>교원</option><option>직원</option><option>조교</option>
            <option>학생</option><option>외부</option><option>기타</option>
          </select>
        </label>
        <label class="f">보직명<input id="p-role" name="roleTitle" maxlength="40" placeholder="예: 학과장"></label>
        <label class="f">연락처 (선택)<input id="p-phone" name="phone" maxlength="20" inputmode="tel" placeholder="내선 또는 휴대전화"></label>
      </div>
      <div class="row"><button class="btn primary" type="submit" id="p-save">인적사항 저장</button></div>
    </form>

    <div class="panel-head">
      <h2>응답할 일정</h2>
      <div class="row">
        <div class="chips" id="filter-respond" role="group" aria-label="구분 필터"></div>
        <button type="button" class="btn small" id="refresh-respond">새로 고침</button>
      </div>
    </div>
    <div class="list" id="respond-list"><div class="empty"><strong>일정을 불러오는 중입니다</strong>잠시만 기다려 주세요.</div></div>
  </section>

  <!-- 일정 관리 -->
  <section id="view-manage" class="list" style="gap:20px" hidden>
    <form class="panel" id="event-form">
      <div class="panel-head">
        <h2 id="event-form-title">새 일정 등록</h2>
        <button type="button" class="btn small" id="ev-cancel" hidden>수정 취소</button>
      </div>
      <div class="grid">
        <label class="f"><span>구분 <span class="req" aria-hidden="true">*</span></span>
          <select id="ev-type" required><option>회의</option><option>행사</option><option>출장</option></select>
        </label>
        <label class="f span2"><span>명칭 <span class="req" aria-hidden="true">*</span></span><input id="ev-title" required maxlength="80" placeholder="예: 2026학년도 2학기 제3차 교수회의"></label>
        <label class="f"><span>날짜 <span class="req" aria-hidden="true">*</span></span><input id="ev-date" type="date" required></label>
        <label class="f"><span>시작 시간 <span class="req" aria-hidden="true">*</span></span><input id="ev-start" type="time" required></label>
        <label class="f">종료 시간<input id="ev-end" type="time"></label>
        <label class="f">회신 기한<input id="ev-deadline" type="date"></label>
        <label class="f span2"><span>장소 <span class="req" aria-hidden="true">*</span></span><input id="ev-place" required maxlength="80" placeholder="예: 공학관 3층 대회의실 / 세종컨벤션센터"></label>
        <label class="f span2">안내 사항<textarea id="ev-note" maxlength="500" placeholder="준비물, 복장, 출장비 정산 안내 등"></textarea></label>
      </div>
      <div class="row"><button class="btn primary" type="submit" id="ev-save">일정 등록</button></div>
    </form>

    <div class="panel-head"><h2>등록된 일정</h2><span class="hint" id="manage-count"></span></div>
    <div class="list" id="manage-list"></div>
  </section>

  <!-- 결과 집계 -->
  <section id="view-results" class="list" style="gap:20px" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>일정별 응답 현황</h2>
        <div class="row">
          <button class="btn small" type="button" id="refresh-results">새로 고침</button>
          <button class="btn small" type="button" id="copy-btn">표 복사</button>
          <a class="btn small" id="sheet-link" href="#" target="_blank" rel="noopener" hidden>스프레드시트 열기</a>
        </div>
      </div>
      <div class="chips" id="filter-results" role="group" aria-label="구분 필터"></div>
      <div class="sum" id="sum-list"></div>
    </div>
    <div class="panel" id="detail" hidden></div>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const TYPES = ["회의", "행사", "출장"];
  const CATEGORIES = ["교원", "직원", "조교", "학생", "외부", "기타"];
  const WD = ["일", "월", "화", "수", "목", "금", "토"];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // google.script.run 을 Promise 로 감싸 서버 함수를 호출
  const call = (fn, ...args) => new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
  const errMsg = (e) => (e && e.message ? e.message.replace(/^Exception:\s*/, "") : "요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.");

  // 로그인 없이 같은 사람을 알아보기 위한 이 브라우저 고유 값
  const KEY = (() => {
    const make = () => {
      const a = new Uint8Array(16); crypto.getRandomValues(a);
      return Array.from(a, (b) => b.toString(16).padStart(2, "0")).join("");
    };
    try {
      let k = localStorage.getItem("att-key");
      if (!k) { k = make(); localStorage.setItem("att-key", k); }
      return k;
    } catch (e) { return make(); }
  })();

  const state = {
    events: [], me: { profile: null, answers: {} }, today: "",
    admin: null, all: [], sheetUrl: "",
    tab: "respond", fResp: "전체", fRes: "전체", fCat: "전체", selected: null,
    drafts: {}, editing: null, confirmDel: null, busy: false,
  };

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2800);
  }
  function showError(msg) { const b = $("error-box"); b.textContent = msg; b.hidden = !msg; }
  function fmtDate(d) {
    if (!d) return "";
    const [y, m, day] = d.split("-").map(Number);
    return `${y}. ${m}. ${day}.(${WD[new Date(y, m - 1, day).getDay()]})`;
  }
  const fmtStamp = (s) => (s ? s.slice(5).replace("-", "/") : "");
  const isClosed = (ev) => ev.closed || (ev.deadline && ev.deadline < state.today);
  const timeText = (ev) => (ev.end ? `${ev.start} ~ ${ev.end}` : ev.start);

  /* ---------- tabs ---------- */
  function setTab(tab) {
    state.tab = tab;
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    ["respond", "manage", "results"].forEach((v) => ($("view-" + v).hidden = v !== tab));
    render();
  }
  document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));

  function chips(el, current, onPick, list = TYPES) {
    el.innerHTML = ["전체", ...list].map((t) => `<button type="button" class="chip" aria-pressed="${t === current}" data-t="${t}">${t}</button>`).join("");
    el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => onPick(b.dataset.t)));
  }

  /* ---------- 응답자 데이터 ---------- */
  async function loadBoard() {
    try {
      const res = await call("api_getBoard", KEY);
      state.events = res.events; state.me = res.me; state.today = res.today;
      showError("");
      fillProfile(true);
      render();
    } catch (e) {
      showError(errMsg(e));
      $("respond-list").innerHTML = `<div class="empty"><strong>일정을 불러오지 못했습니다</strong>[새로 고침]을 눌러 다시 시도해 주세요.</div>`;
    }
  }
  $("refresh-respond").addEventListener("click", loadBoard);

  function fillProfile(force) {
    const p = state.me.profile;
    if (!p) return;
    if (!force && document.activeElement?.closest("#profile-form")) return;
    $("p-name").value = p.name || ""; $("p-dept").value = p.dept || "";
    $("p-category").value = p.category || ""; $("p-role").value = p.roleTitle || ""; $("p-phone").value = p.phone || "";
    $("profile-saved").textContent = p.updatedAt ? `저장됨 ${fmtStamp(p.updatedAt)}` : "";
  }

  $("profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const profile = {
      name: $("p-name").value.trim(), dept: $("p-dept").value.trim(), category: $("p-category").value,
      roleTitle: $("p-role").value.trim(), phone: $("p-phone").value.trim(),
    };
    if (!profile.name || !profile.dept) return toast("성명과 소속 부서(학과)를 입력해 주세요.");
    if (!profile.category) return toast("구분을 선택해 주세요.");
    $("p-save").disabled = true;
    try { state.me = await call("api_saveProfile", KEY, profile); fillProfile(true); toast("인적사항을 저장했습니다."); render(); }
    catch (err) { toast(errMsg(err)); }
    finally { $("p-save").disabled = false; }
  });

  /* ---------- 참석 응답 화면 ---------- */
  function renderRespond() {
    chips($("filter-respond"), state.fResp, (t) => { state.fResp = t; renderRespond(); });
    const list = $("respond-list");
    if (!state.today) return; // 아직 불러오는 중
    if (!state.events.length) {
      list.innerHTML = `<div class="empty"><strong>등록된 회의·행사·출장이 아직 없습니다</strong>행정실에서 일정을 등록하면 이곳에 표시되고, 참석 또는 불참을 선택해 회신할 수 있습니다.</div>`;
      return;
    }
    const evs = state.events.filter((e) => state.fResp === "전체" || e.type === state.fResp);
    if (!evs.length) { list.innerHTML = `<div class="empty"><strong>${esc(state.fResp)} 일정이 없습니다</strong>다른 구분을 선택해 보세요.</div>`; return; }
    if (document.activeElement?.tagName === "TEXTAREA" && list.contains(document.activeElement)) return; // 의견 입력 중에는 다시 그리지 않음
    list.innerHTML = evs.map((ev) => {
      const saved = state.me.answers[ev.id];
      const d = state.drafts[ev.id] || {};
      const status = d.status ?? saved?.status ?? "";
      const comment = d.comment ?? saved?.comment ?? "";
      const closed = isClosed(ev);
      const dirty = !!state.drafts[ev.id] && (status !== (saved?.status ?? "") || comment !== (saved?.comment ?? ""));
      const pill = saved ? `<span class="pill ${saved.status === "참석" ? "yes" : "no"}">${esc(saved.status)} 회신 완료</span>` : `<span class="pill wait">미회신</span>`;
      return `<article class="ev" data-type="${esc(ev.type)}" data-id="${esc(ev.id)}">
        <div class="ev-head">
          <div><span class="type">${esc(ev.type)}</span><h3>${esc(ev.title)}</h3></div>
          <div class="row">${closed ? `<span class="pill warn">회신 마감</span>` : ""}${pill}</div>
        </div>
        <dl class="meta">
          <dt>일시</dt><dd>${fmtDate(ev.date)} ${esc(timeText(ev))}</dd>
          <dt>장소</dt><dd>${esc(ev.place)}</dd>
          ${ev.deadline ? `<dt>회신 기한</dt><dd>${fmtDate(ev.deadline)}까지</dd>` : ""}
          ${ev.note ? `<dt>안내</dt><dd>${esc(ev.note)}</dd>` : ""}
        </dl>
        <div class="seg" role="group" aria-label="참석 여부" style="justify-self:start">
          ${["참석", "불참"].map((v) => `<button type="button" data-v="${v}" aria-pressed="${status === v}" ${closed ? "disabled" : ""}>${v}</button>`).join("")}
        </div>
        <label class="f">의견 (선택)<textarea maxlength="500" placeholder="불참 사유, 대리 참석자, 건의 사항 등" ${closed ? "disabled" : ""}>${esc(comment)}</textarea></label>
        <div class="row">
          <button type="button" class="btn primary small" data-act="submit" ${closed || !status || (!dirty && saved) ? "disabled" : ""}>${saved ? "응답 수정" : "응답 제출"}</button>
          <span class="saved">${saved ? `최종 회신 ${fmtStamp(saved.at)}` : ""}${dirty ? " · 저장하지 않은 변경 사항이 있습니다" : ""}</span>
        </div>
      </article>`;
    }).join("");
    list.querySelectorAll(".ev").forEach((card) => {
      const id = card.dataset.id;
      const ta = card.querySelector("textarea");
      card.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
        state.drafts[id] = { status: b.dataset.v, comment: ta.value };
        renderRespond();
      }));
      ta.addEventListener("input", () => {
        const saved = state.me.answers[id];
        state.drafts[id] = { status: state.drafts[id]?.status ?? saved?.status ?? "", comment: ta.value };
        card.querySelector('[data-act="submit"]').disabled = !state.drafts[id].status;
      });
      ta.addEventListener("blur", () => setTimeout(renderRespond, 0));
      card.querySelector('[data-act="submit"]').addEventListener("click", (e) => submitAnswer(id, ta, e.currentTarget));
    });
  }

  async function submitAnswer(id, ta, btn) {
    if (!state.me.profile) { toast("먼저 인적사항(성명·소속 부서(학과)·구분)을 저장해 주세요."); $("p-name").focus(); return; }
    const status = state.drafts[id]?.status ?? state.me.answers[id]?.status;
    if (!status) return toast("참석 또는 불참을 선택해 주세요.");
    btn.disabled = true; btn.textContent = "저장 중…";
    try {
      state.me = await call("api_submit", KEY, id, status, ta.value.trim());
      delete state.drafts[id];
      toast(`${status}(으)로 회신했습니다.`);
    } catch (err) { toast(errMsg(err)); }
    ta.blur();
    renderRespond();
  }

  /* ---------- 관리자 ---------- */
  $("admin-open").addEventListener("click", () => { $("admin-form").hidden = false; $("admin-pw").focus(); });
  $("admin-close").addEventListener("click", () => { $("admin-form").hidden = true; });
  $("admin-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = $("admin-pw").value;
    if (!pw) return toast("비밀번호를 입력해 주세요.");
    $("admin-login").disabled = true;
    try {
      await call("api_adminLogin", pw);
      state.admin = pw;
      $("admin-pw").value = ""; $("admin-form").hidden = true;
      $("admin-open").hidden = true; $("admin-logout").hidden = false;
      $("who-role").textContent = "행정실(관리자)";
      $("tab-manage").hidden = false; $("tab-results").hidden = false;
      await loadAdmin();
      setTab("manage");
      toast("관리자 화면이 열렸습니다.");
    } catch (err) { toast(errMsg(err)); }
    finally { $("admin-login").disabled = false; }
  });
  $("admin-logout").addEventListener("click", () => {
    state.admin = null; state.all = [];
    $("admin-open").hidden = false; $("admin-logout").hidden = true;
    $("who-role").textContent = "응답자";
    $("tab-manage").hidden = true; $("tab-results").hidden = true;
    resetEventForm();
    setTab("respond");
  });

  function applyAdmin(res) {
    state.events = res.events; state.all = res.answers; state.today = res.today; state.sheetUrl = res.sheetUrl;
    render();
  }
  async function loadAdmin() {
    if (!state.admin) return;
    try { applyAdmin(await call("api_adminData", state.admin)); }
    catch (err) { toast(errMsg(err)); }
  }
  $("refresh-results").addEventListener("click", loadAdmin);

  /* ---------- 일정 관리 화면 ---------- */
  function resetEventForm() {
    state.editing = null;
    $("event-form").reset();
    $("event-form-title").textContent = "새 일정 등록";
    $("ev-save").textContent = "일정 등록";
    $("ev-cancel").hidden = true;
  }
  $("ev-cancel").addEventListener("click", resetEventForm);
  $("event-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const ev = {
      id: state.editing || "", type: $("ev-type").value, title: $("ev-title").value.trim(), date: $("ev-date").value,
      start: $("ev-start").value, end: $("ev-end").value, place: $("ev-place").value.trim(),
      deadline: $("ev-deadline").value, note: $("ev-note").value.trim(),
    };
    if (ev.end && ev.end < ev.start) return toast("종료 시간이 시작 시간보다 빠릅니다.");
    $("ev-save").disabled = true;
    try {
      applyAdmin(await call("api_adminSaveEvent", state.admin, ev));
      toast(state.editing ? "일정을 수정했습니다." : "일정을 등록했습니다. 응답 화면에 바로 표시됩니다.");
      resetEventForm();
    } catch (err) { toast(errMsg(err)); }
    finally { $("ev-save").disabled = false; }
  });

  function counts(evId) {
    let y = 0, n = 0;
    state.all.forEach((r) => { if (r.eventId !== evId) return; if (r.status === "참석") y++; else if (r.status === "불참") n++; });
    return { y, n, t: y + n };
  }

  function renderManage() {
    const evs = state.events;
    $("manage-count").textContent = evs.length ? `총 ${evs.length}건` : "";
    const list = $("manage-list");
    if (!evs.length) { list.innerHTML = `<div class="empty"><strong>등록된 일정이 없습니다</strong>위 양식에 구분, 명칭, 날짜, 시간, 장소를 입력해 첫 일정을 등록하세요.</div>`; return; }
    list.innerHTML = evs.map((ev) => {
      const c = counts(ev.id);
      return `<article class="ev" data-type="${esc(ev.type)}" data-id="${esc(ev.id)}">
        <div class="ev-head">
          <div><span class="type">${esc(ev.type)}</span><h3>${esc(ev.title)}</h3></div>
          <div class="row">${isClosed(ev) ? `<span class="pill warn">회신 마감</span>` : `<span class="pill yes">회신 접수 중</span>`}<span class="nums"><span class="y">참석 ${c.y}</span> · <span class="n">불참 ${c.n}</span></span></div>
        </div>
        <dl class="meta">
          <dt>일시</dt><dd>${fmtDate(ev.date)} ${esc(timeText(ev))}</dd>
          <dt>장소</dt><dd>${esc(ev.place)}</dd>
          ${ev.deadline ? `<dt>회신 기한</dt><dd>${fmtDate(ev.deadline)}</dd>` : ""}
        </dl>
        <div class="row">
          <button type="button" class="btn small" data-act="edit">수정</button>
          <button type="button" class="btn small" data-act="close">${ev.closed ? "회신 다시 열기" : "회신 마감"}</button>
          <button type="button" class="btn small" data-act="view">결과 보기</button>
          ${state.confirmDel === ev.id
            ? `<span class="confirm">삭제하면 되돌릴 수 없습니다. <button type="button" class="btn small danger" data-act="del-yes">삭제</button><button type="button" class="btn small" data-act="del-no">취소</button></span>`
            : `<button type="button" class="btn small danger" data-act="del">삭제</button>`}
        </div>
      </article>`;
    }).join("");
    list.querySelectorAll(".ev").forEach((card) => {
      const id = card.dataset.id; const ev = state.events.find((x) => x.id === id);
      card.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
        const act = b.dataset.act;
        if (act === "edit") {
          state.editing = id;
          $("ev-type").value = ev.type; $("ev-title").value = ev.title; $("ev-date").value = ev.date;
          $("ev-start").value = ev.start; $("ev-end").value = ev.end || ""; $("ev-place").value = ev.place;
          $("ev-deadline").value = ev.deadline || ""; $("ev-note").value = ev.note || "";
          $("event-form-title").textContent = "일정 수정"; $("ev-save").textContent = "수정 내용 저장"; $("ev-cancel").hidden = false;
          $("event-form").scrollIntoView({ behavior: "smooth", block: "start" }); $("ev-title").focus();
        } else if (act === "close") {
          b.disabled = true;
          try { applyAdmin(await call("api_adminToggleClose", state.admin, id)); toast(ev.closed ? "회신을 다시 열었습니다." : "회신을 마감했습니다."); }
          catch (err) { toast(errMsg(err)); b.disabled = false; }
        } else if (act === "view") { state.selected = id; setTab("results"); }
        else if (act === "del") { state.confirmDel = id; renderManage(); }
        else if (act === "del-no") { state.confirmDel = null; renderManage(); }
        else if (act === "del-yes") {
          state.confirmDel = null; b.disabled = true;
          try { applyAdmin(await call("api_adminDeleteEvent", state.admin, id)); toast("일정을 삭제했습니다."); if (state.editing === id) resetEventForm(); }
          catch (err) { toast(errMsg(err)); }
        }
      }));
    });
  }

  /* ---------- 결과 집계 화면 ---------- */
  function rowsFor(evId) {
    const catOrder = (c) => { const i = CATEGORIES.indexOf(c); return i < 0 ? 99 : i; };
    return state.all.filter((r) => r.eventId === evId).sort((a, b) =>
      (a.status === b.status ? 0 : a.status === "참석" ? -1 : 1) ||
      catOrder(a.category) - catOrder(b.category) ||
      (a.dept || "").localeCompare(b.dept || "") || (a.name || "").localeCompare(b.name || ""));
  }

  const visibleRows = (evId) => rowsFor(evId).filter((r) => state.fCat === "전체" || r.category === state.fCat);

  function renderResults() {
    chips($("filter-results"), state.fRes, (t) => { state.fRes = t; renderResults(); });
    const link = $("sheet-link");
    link.hidden = !state.sheetUrl; if (state.sheetUrl) link.href = state.sheetUrl;
    const sum = $("sum-list"); const det = $("detail");
    if (!state.events.length) {
      sum.innerHTML = `<div class="empty"><strong>집계할 일정이 없습니다</strong>일정 관리 탭에서 일정을 등록하면 응답이 들어오는 대로 이곳에 집계됩니다.</div>`;
      det.hidden = true; return;
    }
    const evs = state.events.filter((e) => state.fRes === "전체" || e.type === state.fRes);
    if (!state.selected || !state.events.some((e) => e.id === state.selected)) state.selected = (evs[0] || state.events[0]).id;
    sum.innerHTML = evs.length ? evs.map((ev) => {
      const c = counts(ev.id); const w = c.t || 1;
      return `<button type="button" class="sum-row" data-id="${esc(ev.id)}" aria-pressed="${ev.id === state.selected}">
        <span class="t"><b>[${esc(ev.type)}] ${esc(ev.title)}</b><small>${fmtDate(ev.date)} ${esc(ev.start)} · ${esc(ev.place)}</small></span>
        <span class="bar" aria-hidden="true"><i class="y" style="width:${(c.y / w) * 100}%"></i><i class="n" style="width:${(c.n / w) * 100}%"></i></span>
        <span class="nums"><span class="y">${c.y}</span> / <span class="n">${c.n}</span> · 계 ${c.t}</span>
      </button>`;
    }).join("") : `<div class="empty">${esc(state.fRes)} 일정이 없습니다.</div>`;
    sum.querySelectorAll(".sum-row").forEach((b) => b.addEventListener("click", () => { state.selected = b.dataset.id; renderResults(); }));

    const ev = state.events.find((e) => e.id === state.selected);
    det.hidden = false;
    const all = rowsFor(ev.id); const rows = visibleRows(ev.id);
    const c = { y: rows.filter((r) => r.status === "참석").length, n: rows.filter((r) => r.status === "불참").length }; c.t = c.y + c.n;
    const commented = rows.filter((r) => r.comment).length;
    const byCat = CATEGORIES.map((cat) => [cat, rows.filter((r) => r.category === cat && r.status === "참석").length]).filter(([, n]) => n);
    det.innerHTML = `
      <div class="panel-head"><h2>[${esc(ev.type)}] ${esc(ev.title)}</h2><span class="hint">${fmtDate(ev.date)} ${esc(timeText(ev))} · ${esc(ev.place)}</span></div>
      <div class="row"><span class="hint">응답자 구분</span><div class="chips" id="filter-cat" role="group" aria-label="응답자 구분 필터"></div></div>
      <div class="stats">
        <div class="stat"><span>응답 인원</span><b>${c.t}</b></div>
        <div class="stat y"><span>참석</span><b>${c.y}</b></div>
        <div class="stat n"><span>불참</span><b>${c.n}</b></div>
        <div class="stat"><span>의견 작성</span><b>${commented}</b></div>
      </div>
      ${byCat.length ? `<div class="bycat">구분별 참석: ${byCat.map(([cat, n]) => `<span>${cat} <b>${n}</b></span>`).join("")}</div>` : ""}
      ${rows.length ? `<div class="tbl-wrap"><table id="detail-table">
        <thead><tr><th>번호</th><th>성명</th><th>소속 부서(학과)</th><th>구분</th><th>보직명</th><th>연락처</th><th>응답</th><th>의견</th><th>회신 일시</th></tr></thead>
        <tbody>${rows.map((r, i) => `<tr>
          <td class="num">${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.dept)}</td><td>${esc(r.category)}</td><td>${esc(r.roleTitle)}</td><td class="num">${esc(r.phone)}</td>
          <td><span class="pill ${r.status === "참석" ? "yes" : "no"}">${esc(r.status)}</span></td>
          <td>${esc(r.comment) || '<span class="hint">—</span>'}</td><td class="num">${esc(fmtStamp(r.at))}</td></tr>`).join("")}</tbody>
      </table></div>` : all.length ? `<div class="empty"><strong>${esc(state.fCat)} 응답자가 없습니다</strong>다른 구분을 선택해 보세요.</div>` : `<div class="empty"><strong>아직 회신이 없습니다</strong>응답이 제출되면 성명·소속 부서(학과)·구분·보직명·의견과 함께 이 표에 표시됩니다.</div>`}`;
    chips($("filter-cat"), state.fCat, (t) => { state.fCat = t; renderResults(); }, CATEGORIES);
  }

  $("copy-btn").addEventListener("click", async () => {
    const ev = state.events.find((e) => e.id === state.selected); if (!ev) return;
    const text = [["성명", "소속 부서(학과)", "구분", "보직명", "연락처", "응답", "의견", "회신일시"].join("\t"),
      ...visibleRows(ev.id).map((r) => [r.name, r.dept, r.category, r.roleTitle, r.phone, r.status, (r.comment || "").replace(/\s+/g, " "), r.at].join("\t"))].join("\n");
    try { await navigator.clipboard.writeText(text); toast("선택한 일정의 표를 복사했습니다. 엑셀에 붙여넣을 수 있습니다."); }
    catch (e) {
      const t = $("detail-table"); if (!t) return;
      const r = document.createRange(); r.selectNodeContents(t); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      toast("표를 선택했습니다. Ctrl+C로 복사해 주세요.");
    }
  });

  /* ---------- render & boot ---------- */
  function render() {
    if (state.tab === "respond") renderRespond();
    else if (state.tab === "manage") renderManage();
    else renderResults();
  }

  // 관리자가 결과 화면을 보고 있으면 1분마다 새 응답을 반영
  setInterval(() => { if (state.admin && state.tab === "results" && !document.hidden) loadAdmin(); }, 60000);

  loadBoard();
})();
</script>
</body>
</html>
