<text x="1081.1" y="527.0" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">성별 권력관계</text>
<text x="1081.1" y="560.0" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">(불평등한 위계)</text>
<text x="1081.1" y="607.0" text-anchor="middle" font-size="20" fill="#3a3550">· 자원·지위·의사결정권의 불균형</text>
<text x="1081.1" y="643.0" text-anchor="middle" font-size="20" fill="#3a3550">· 통제와 지배를 '당연한 것'으로 인식</text>
<g filter="url(#sh)"><rect x="886.1" y="932.0" width="390" height="176" rx="22" fill="#fff" stroke="#D9534F" stroke-width="4"/></g>
<rect x="886.1" y="932.0" width="390" height="80" rx="22" fill="#D9534F"/><rect x="886.1" y="990.0" width="390" height="22" fill="#D9534F"/>
<text x="1081.1" y="984.0" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">왜곡된 성문화</text>
<text x="1081.1" y="1047.0" text-anchor="middle" font-size="20" fill="#3a3550">· 성적 대상화·성 상품화</text>
<text x="1081.1" y="1083.0" text-anchor="middle" font-size="20" fill="#3a3550">· 강간 통념, 남성 연대·침묵의 문화</text>
<g filter="url(#sh)"><rect x="505.0" y="1152.0" width="390" height="176" rx="22" fill="#fff" stroke="#E07B2E" stroke-width="4"/></g>
<rect x="505.0" y="1152.0" width="390" height="80" rx="22" fill="#E07B2E"/><rect x="505.0" y="1210.0" width="390" height="22" fill="#E07B2E"/>
<text x="700.0" y="1204.0" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">폭력의 용인·묵인</text>
<text x="700.0" y="1267.0" text-anchor="middle" font-size="20" fill="#3a3550">· 피해자 비난, 2차 피해</text>
<text x="700.0" y="1303.0" text-anchor="middle" font-size="20" fill="#3a3550">· 가해의 축소·사소화, 낮은 처벌</text>
<g filter="url(#sh)"><rect x="123.9" y="932.0" width="390" height="176" rx="22" fill="#fff" stroke="#C0392B" stroke-width="4"/></g>
<rect x="123.9" y="932.0" width="390" height="80" rx="22" fill="#C0392B"/><rect x="123.9" y="990.0" width="390" height="22" fill="#C0392B"/>
<text x="318.9" y="967.0" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">젠더기반폭력</text>
<text x="318.9" y="1000.0" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">발생</text>
<text x="318.9" y="1047.0" text-anchor="middle" font-size="20" fill="#3a3550">· 성폭력·가정폭력·교제폭력</text>
<text x="318.9" y="1083.0" text-anchor="middle" font-size="20" fill="#3a3550">· 스토킹·디지털 성범죄 등</text>
<g filter="url(#sh)"><rect x="123.9" y="492.0" width="390" height="176" rx="22" fill="#fff" stroke="#4A6FB5" stroke-width="4"/></g>
<rect x="123.9" y="492.0" width="390" height="80" rx="22" fill="#4A6FB5"/><rect x="123.9" y="550.0" width="390" height="22" fill="#4A6FB5"/>
<text x="318.9" y="527.0" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">성차별 구조의</text>
<text x="318.9" y="560.0" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">재생산·강화</text>
<text x="318.9" y="607.0" text-anchor="middle" font-size="20" fill="#3a3550">· 피해자의 위축·침묵, 참여 제한</text>
<text x="318.9" y="643.0" text-anchor="middle" font-size="20" fill="#3a3550">· 기존 규범과 권력 구조의 고착화</text>
<text x="700.0" y="1438" text-anchor="middle" font-size="19" fill="#8a8499">근거: UN 「여성폭력철폐선언」(1993) — 여성폭력은 남녀 간 역사적으로 불평등한 권력관계의 표현 / CEDAW 일반권고 제35호(2017)</text>
<text x="700.0" y="1468" text-anchor="middle" font-size="19" fill="#8a8499">— 젠더기반폭력은 성 고정관념·남성 특권 이데올로기·사회 규범 등 성별 관련 요인에 뿌리를 두며 이를 유지시키는 수단으로 작동</text>
