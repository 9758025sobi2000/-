<text x="700" y="760" text-anchor="middle" font-size="40" font-weight="700" fill="#2b2540">성차별적 구조</text>
<text x="700" y="808" text-anchor="middle" font-size="24" font-weight="400" fill="#555">개인의 일탈이 아닌</text>
<text x="700" y="842" text-anchor="middle" font-size="24" font-weight="400" fill="#555">사회 구조의 문제</text>
<text x="700" y="892" text-anchor="middle" font-size="26" font-weight="700" fill="#7B4FBF">↻ 끊임없이 순환</text>
