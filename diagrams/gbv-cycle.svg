<text x="700.0" y="307.0" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">성역할 규범과</text>
<text x="700.0" y="340.0" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">성별 고정관념</text>
<text x="700.0" y="387.0" text-anchor="middle" font-size="20" fill="#3a3550">· '남성다움/여성다움'의 고정된 기대</text>
<text x="700.0" y="423.0" text-anchor="middle" font-size="20" fill="#3a3550">· 주도·공격성 vs 순종·돌봄 역할 부여</text>
<g filter="url(#sh)"><rect x="886.1" y="492.0" width="390" height="176" rx="22" fill="#fff" stroke="#B5468F" stroke-width="4"/></g>
