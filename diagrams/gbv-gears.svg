<text x="1188" y="958" font-size="26" fill="#2b2540" xml:space="preserve" font-weight="700">• 폭력은 통제와</text>
<text x="1188" y="998" font-size="26" fill="#2b2540" xml:space="preserve" font-weight="700">   지배의 수단</text>
<text x="800.0" y="1152" text-anchor="middle" font-size="18" fill="#8a8499">성차별 구조·성역할 규범·성별 고정관념·젠더 권력관계가 맞물려 돌아가며 젠더기반폭력을 만들어내고, 폭력은 다시 이 구조를 강화한다.</text>
